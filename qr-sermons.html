<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This Week's Message — Purpose Church of Denton</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--b:#6B1F3A;--g:#C9A84C;--gl:#E8D49A;--n:#0E1B2E;--c:#FAF7F2;--w:#fff;}
body{font-family:Jost,sans-serif;background:var(--n);color:var(--w);min-height:100vh;display:flex;flex-direction:column;align-items:center;}

.header{width:100%;background:rgba(107,31,58,0.15);border-bottom:1px solid rgba(201,168,76,0.2);padding:1.2rem 1.5rem;display:flex;align-items:center;justify-content:center;gap:0.8rem;}
.header-cross{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--g);}
.header-name{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--gl);letter-spacing:0.05em;}

.card{width:100%;max-width:480px;padding:2rem 1.5rem;flex:1;display:flex;flex-direction:column;justify-content:center;}

.eyebrow{font-size:0.65rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--g);font-weight:600;margin-bottom:1.2rem;display:flex;align-items:center;gap:0.6rem;}
.eyebrow::before,.eyebrow::after{content:'';flex:1;height:1px;background:rgba(201,168,76,0.25);}

.sermon-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,8vw,3rem);font-weight:400;line-height:1.15;color:var(--w);margin-bottom:1rem;}
.sermon-scripture{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;color:var(--gl);margin-bottom:1.8rem;}
.sermon-date{font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:0.6rem;}
.sermon-series{font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--g);font-weight:600;margin-bottom:1.6rem;}

.divider{width:48px;height:2px;background:var(--b);margin:1.8rem 0;}

.notes-label{font-size:0.62rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--g);font-weight:600;margin-bottom:1rem;}
.note-item{display:flex;gap:0.75rem;align-items:flex-start;margin-bottom:0.75rem;font-size:0.92rem;color:rgba(255,255,255,0.8);line-height:1.6;}
.note-bullet{color:var(--g);font-size:0.7rem;margin-top:0.35rem;flex-shrink:0;}

.footer{width:100%;padding:1.5rem;text-align:center;border-top:1px solid rgba(255,255,255,0.06);}
.footer a{color:var(--g);font-size:0.75rem;letter-spacing:0.1em;text-decoration:none;text-transform:uppercase;}

.loading{text-align:center;padding:3rem;color:rgba(255,255,255,0.4);font-size:0.9rem;}
.empty{text-align:center;padding:3rem;}
.empty-icon{font-size:3rem;margin-bottom:1rem;opacity:0.3;}
.empty-text{color:rgba(255,255,255,0.35);font-size:0.88rem;line-height:1.7;}
</style>
</head>
<body>

<div class="header">
  <span class="header-cross">✝</span>
  <span class="header-name">Purpose Church of Denton</span>
</div>

<div class="card" id="content">
  <div class="loading">Loading this week's message…</div>
</div>

<div class="footer">
  <a href="https://purposechurchofdenton.com">purposechurchofdenton.com</a>
</div>

<script>
var PROJECT = "purposechurchdenton";
var API_KEY = "AIzaSyDpE_gUXCy12EO6qwcz2BuFMyiY1UcJc-w";

function fetchSermons() {
  var url = "https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents/sermons?key=" + API_KEY + "&pageSize=20";
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){
      var docs = (data.documents || []).map(function(doc) {
        var f = doc.fields || {};
        var get = function(k){ return f[k] ? (f[k].stringValue || f[k].integerValue || '') : ''; };
        return { title: get('title'), scripture: get('scripture'), date: get('date'), series: get('series'), notes: get('notes') };
      }).filter(function(s){ return s.title; });

      // Sort by date descending — pick most recent
      docs.sort(function(a,b){
        return new Date(b.date || 0) - new Date(a.date || 0);
      });

      render(docs[0] || null);
    })
    .catch(function(){ render(null); });
}

function render(s) {
  var el = document.getElementById('content');
  if (!s) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📖</div><div class="empty-text">No sermon posted yet.<br>Check back soon.</div></div>';
    return;
  }
  var notesHtml = '';
  if (s.notes) {
    var lines = s.notes.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    if (lines.length) {
      notesHtml = '<div class="notes-label">Key Points</div>' +
        lines.map(function(l){
          return '<div class="note-item"><span class="note-bullet">◆</span><span>' + esc(l) + '</span></div>';
        }).join('');
    }
  }
  el.innerHTML =
    '<div class="eyebrow">This Week\'s Message</div>' +
    (s.date ? '<div class="sermon-date">' + esc(s.date) + '</div>' : '') +
    (s.series ? '<div class="sermon-series">' + esc(s.series) + '</div>' : '') +
    '<div class="sermon-title">' + esc(s.title) + '</div>' +
    (s.scripture ? '<div class="sermon-scripture">' + esc(s.scripture) + '</div>' : '') +
    (notesHtml ? '<div class="divider"></div>' + notesHtml : '');
}

function esc(t){ var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

fetchSermons();
</script>
</body>
</html>
